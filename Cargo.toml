[package]
name = "termdeck"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A configurable terminal workspace with a master-and-preview-stack interface"
license = "MIT"
repository = ""

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
