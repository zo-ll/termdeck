[package]
name = "termdeck"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A configurable terminal workspace with a master-and-preview-stack interface"
default-run = "termdeck"
license = "MIT"
repository = "https://github.com/zo-ll/termdeck"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
libc = "0.2"
portable-pty = "0.9"
ratatui = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
