name: CI

on: [push, pull_request]

# Every job is bounded. The suite drives real PTYs, real process groups, and a
# real Unix socket, so the failure mode of a regression there is a hang rather
# than a red assertion: without a ceiling a wedged test holds a runner for six
# hours (#130).
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` is the only place a version is written. The
      # workflow used to install `stable`, which meant CI and the repo could
      # disagree about the compiler and nobody would notice; this installs
      # exactly what the file pins and fails if the wrong one ends up active.
      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "rust-toolchain.toml pins: $channel"
          rustup toolchain install "$channel" --profile minimal -c clippy -c rustfmt
          rustup default "$channel"
          rustc --version
          rustc --version | grep -q "$channel"

      # The shell-hook compatibility tests skip the shell they cannot find, so
      # a green suite on a machine without Zsh or Fish proves only Bash. CI is
      # where the other two have to exist for the claim to mean anything.
      - name: Install the shells the hook tests exercise
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh fish
          bash --version | head -1
          zsh --version
          fish --version

      # `--locked` everywhere a lockfile is read: CI resolves the dependency
      # versions that are committed, and a `Cargo.lock` that would have to
      # change fails the job instead of being rewritten silently.
      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        timeout-minutes: 20
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      # The suite runs in two steps, and the split is the honest half of the
      # flake story below: everything except the one environmentally-sensitive
      # test runs here, with no second chance at all.
      - name: Tests
        timeout-minutes: 20
        run: |
          cargo test --locked --all-targets --all-features -- \
            --skip shutdown_terms_all_groups_then_kills_survivors_and_joins_threads

      # `shutdown_terms_all_groups_then_kills_survivors_and_joins_threads`
      # spawns real process groups and then signals them. Under a restricted
      # sandbox — the containerised environment this project is developed in —
      # the kernel refuses part of that and the test fails, where a re-run in
      # the same place passes. It is environmental, and a GitHub runner is not
      # that environment, so this step is expected to pass first time here:
      # the retry is a safety net, not a licence.
      #
      # Exactly one retry, and only for this test. A true regression fails
      # both attempts and reds the job, while every other test in the suite
      # stays fail-on-first — retrying a whole suite is how a real
      # intermittent bug gets laundered into a green check. If this step ever
      # needs its retry on a GitHub runner, that is a finding about the test
      # and not about the sandbox: say so in #130 rather than widening this.
      - name: Tests — the sandbox-sensitive shutdown case (one retry)
        timeout-minutes: 10
        run: |
          set -uo pipefail
          case_name=engine::native::tests::shutdown_terms_all_groups_then_kills_survivors_and_joins_threads
          # A filter that matches nothing is a *pass* to libtest — "0 passed,
          # N filtered out", exit 0 — so a rename would quietly turn this step
          # into a no-op guarding a test that is no longer run anywhere. Check
          # the name still selects something before trusting the result. The
          # listing is captured before grep: a live pipe closes on `-q`'s first
          # match and cargo's BrokenPipe then fails the whole pipeline under
          # `pipefail`, which this guard exists to detect, not to imitate.
          case_list="$(cargo test --locked --all-features --lib "$case_name" -- --exact --list 2>/dev/null || true)"
          if ! grep -q "^$case_name: test$" <<< "$case_list"; then
            echo "::error::$case_name is not in the suite: update this step's name or drop it"
            exit 1
          fi
          for attempt in 1 2; do
            echo "::group::attempt $attempt"
            if cargo test --locked --all-features --lib "$case_name" -- --exact; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::$case_name failed on attempt $attempt"
          done
          echo "::error::$case_name failed twice: treat this as a regression, not the sandbox flake"
          exit 1

  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"
          rustc --version

      # Built from source rather than pulled from a third-party action, so the
      # supply chain of the supply-chain check is the crates.io index and this
      # repository's own toolchain. It is the slow half of this job, which is
      # why the ceilings differ: the build gets ten minutes, the scan five.
      - name: Install cargo-audit
        timeout-minutes: 10
        run: cargo install cargo-audit --locked

      # Default severity: a vulnerability advisory fails the *step*. Warnings —
      # unmaintained or yanked crates, `serde_yaml 0.9.34+deprecated` among
      # them — are reported without failing, because replacing that dependency
      # is its own decision (#130) and should not block unrelated work. Turn
      # this into `--deny warnings` once that decision lands.
      #
      # `continue-on-error` keeps the finding off the critical path. An
      # advisory is published against a dependency by a third party at a time
      # nobody here chooses, and it would otherwise red every push until it is
      # dealt with — blocking work that has nothing to do with it. The scan is
      # still run on every push and its result is still reported, loudly, by
      # the step below; only the blocking is dropped. The install step above
      # keeps failing hard on purpose: a scan that could not run is a broken
      # CI, not a security finding. (The other shape of this is a scheduled
      # job that opens an issue; it costs a `schedule:` trigger and a token,
      # and can replace this once someone wants the notification.)
      - name: Dependency advisories
        id: audit
        timeout-minutes: 5
        continue-on-error: true
        run: cargo audit

      # Not decoration: a `continue-on-error` step that fails is easy to scroll
      # past, so the finding is restated as a warning annotation and written
      # into the run summary, where it is read without opening the log.
      - name: Report advisories
        if: steps.audit.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "::warning::cargo audit reported findings — see the Dependency advisories step"
          {
            echo "### Dependency advisories"
            echo
            echo "\`cargo audit\` reported findings on this run. They do not block"
            echo "the gate (see the comment in \`.github/workflows/ci.yml\`), and they"
            echo "do need an owner: triage them against #130."
          } >> "$GITHUB_STEP_SUMMARY"
